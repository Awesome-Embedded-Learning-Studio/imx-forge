name: Docker Image Publish

on:
  push:
    branches:
      - test/auto-build-docker-image-test  # 测试分支，测试通过后改回 main
  # TODO: 测试通过后，取消注释以下行
  # tags:
  #   - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: test)'
        required: false
        default: 'test'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/awesome-embedded-learning-studio/imx-forge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=test,enable={{branch == 'test/auto-build-docker-image-test'}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
