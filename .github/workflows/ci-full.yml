name: Full Build

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, opened, synchronize]
  workflow_dispatch:
    inputs:
      stage:
        description: '构建阶段'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '1'
          - '2'
          - '3'
          - '4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: imx-forge:ci
  BUILD_OUTPUT: out/release-latest

jobs:
  # 检查是否应该运行
  check:
    name: Check Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      compile_3rd_party: ${{ steps.check.outputs.compile_3rd_party }}
    steps:
      - id: check
        run: |
          SHOULD_RUN="false"
          COMPILE_3RD_PARTY="false"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHOULD_RUN="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHOULD_RUN="true"
          elif [[ "${{ github.event.label.name }}" == "full-build" ]]; then
            SHOULD_RUN="true"
          elif [[ "${{ env.HAS_FULL_BUILD_LABEL }}" == "true" ]]; then
            SHOULD_RUN="true"
          fi
          if [[ "${{ env.HAS_COMPILE_3RD_PARTY_LABEL }}" == "true" ]]; then
            COMPILE_3RD_PARTY="true"
          fi
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          echo "compile_3rd_party=$COMPILE_3RD_PARTY" >> $GITHUB_OUTPUT
        env:
          HAS_FULL_BUILD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-build') }}
          HAS_COMPILE_3RD_PARTY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'compile-support-3rd-party') }}

  # Stage 1: U-Boot
  stage1:
    name: Stage 1 - U-Boot
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_run == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 初始化 U-Boot 子模块
        run: git submodule update --init --depth=1 third_party/uboot-imx

      - name: 构建 Docker 镜像
        run: cd docker && docker build -t ${{ env.DOCKER_IMAGE }} .

      - name: Cache ccache for U-Boot (Stage 1)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-full-uboot-${{ github.base_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-full-uboot-${{ github.base_ref || github.ref_name }}-
            ${{ runner.os }}-ccache-full-uboot-

      - name: 构建 U-Boot (Stage 1)
        run: |
          docker run --rm --user root \
            -v $PWD:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_BASEDIR=/workspace \
            -e CCACHE_NOHASHDIR=true \
            -e CCACHE_COMPILERCHECK=content \
            ${{ env.DOCKER_IMAGE }} \
            bash -c '
              set -e
              git config --global --add safe.directory "*"
              ccache -M 2G && ccache -z
              mkdir -p /workspace/ccache-bin
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-gcc
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-g++
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-ar
              export PATH="/workspace/ccache-bin:${PATH}"
              ./scripts/release-all.sh --stage 1
              ccache -s
            '

      - name: 验证产物
        run: |
          if [ ! -f ${{ env.BUILD_OUTPUT }}/uboot/u-boot-dtb.imx ]; then
            echo "::error::产物缺失: ${{ env.BUILD_OUTPUT }}/uboot/u-boot-dtb.imx"
            echo "上方「构建 U-Boot」步骤可能已失败(回看其日志);实际 uboot/ 内容:"
            ls -lh ${{ env.BUILD_OUTPUT }}/uboot/ 2>/dev/null || echo "(目录不存在)"
            exit 1
          fi
          ls -lh ${{ env.BUILD_OUTPUT }}/uboot/

  # Stage 2: 双内核并行构建
  stage2-imx:
    name: Stage 2 - Linux (NXP BSP)
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_run == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 初始化 linux-imx 子模块
        run: git submodule update --init --depth=1 third_party/linux-imx

      - name: 构建 Docker 镜像
        run: cd docker && docker build -t ${{ env.DOCKER_IMAGE }} .

      - name: Cache ccache for Linux NXP BSP (Stage 2)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-full-linux-imx-${{ github.base_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-full-linux-imx-${{ github.base_ref || github.ref_name }}-
            ${{ runner.os }}-ccache-full-linux-imx-

      - name: 构建 Linux NXP BSP (Stage 2)
        run: |
          docker run --rm --user root \
            -v $PWD:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_BASEDIR=/workspace \
            -e CCACHE_NOHASHDIR=true \
            -e CCACHE_COMPILERCHECK=content \
            ${{ env.DOCKER_IMAGE }} \
            bash -c '
              set -e
              git config --global --add safe.directory "*"
              ccache -M 2G && ccache -z
              mkdir -p /workspace/ccache-bin
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-gcc
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-g++
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-ar
              export PATH="/workspace/ccache-bin:${PATH}"
              ./scripts/release-all.sh --stage 2
              ccache -s
            '

      - name: 验证产物
        run: |
          if [ ! -f ${{ env.BUILD_OUTPUT }}/linux/arch/arm/boot/zImage ] || \
             [ ! -f ${{ env.BUILD_OUTPUT }}/linux/arch/arm/boot/dts/nxp/imx/imx6ull-aes.dtb ]; then
            echo "::error::Linux (NXP BSP) 产物缺失;上方「构建 Linux NXP BSP」步骤可能已失败(回看其日志)"
            ls -lh ${{ env.BUILD_OUTPUT }}/linux/arch/arm/boot/ 2>/dev/null || echo "(目录不存在)"
            exit 1
          fi

  stage2-mainline:
    name: Stage 2 - Linux (Mainline)
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_run == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 初始化 linux-mainline 子模块
        run: git submodule update --init --depth=1 third_party/linux_mainline

      - name: 构建 Docker 镜像
        run: cd docker && docker build -t ${{ env.DOCKER_IMAGE }} .

      - name: Cache ccache for Linux Mainline
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-full-linux-mainline-${{ github.base_ref || github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-ccache-full-linux-mainline-${{ github.base_ref || github.ref_name }}-
            ${{ runner.os }}-ccache-full-linux-mainline-

      - name: 构建 Linux Mainline
        run: |
          docker run --rm --user root \
            -v $PWD:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_BASEDIR=/workspace \
            -e CCACHE_NOHASHDIR=true \
            -e CCACHE_COMPILERCHECK=content \
            ${{ env.DOCKER_IMAGE }} \
            bash -c '
              set -e
              git config --global --add safe.directory "*"
              ccache -M 5G && ccache -z
              mkdir -p /workspace/ccache-bin
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-gcc
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-g++
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-ar
              export PATH="/workspace/ccache-bin:${PATH}"
              ./scripts/release-all.sh --mainline --stage 2
              ccache -s
            '

      - name: 验证产物
        run: |
          if [ ! -f out/release-latest/linux/arch/arm/boot/zImage ] || \
             [ ! -f out/release-latest/linux/arch/arm/boot/dts/nxp/imx/imx6ull-aes.dtb ] || \
             ! grep -q "Kernel Track: mainline" out/release-latest/linux/build_info.txt; then
            echo "::error::Linux (Mainline) 产物缺失或 build_info 无 Kernel Track;上方「构建 Linux Mainline」步骤可能已失败(回看其日志)"
            ls -lh out/release-latest/linux/arch/arm/boot/ 2>/dev/null || echo "(目录不存在)"
            cat out/release-latest/linux/build_info.txt 2>/dev/null || echo "(build_info.txt 不存在)"
            exit 1
          fi

      - name: 制作 QEMU 启动资产（真板同源 dtb + MAC fixup）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends device-tree-compiler
          # out/ 由 docker 内 root 构建,runner 用户不可写;资产产出到独立目录 qemu-assets/
          # release-all 的内核构建目录是 out/release-latest/linux(非 standalone 的 out/mainline/linux)
          mkdir -p qemu-assets
          cp out/release-latest/linux/arch/arm/boot/zImage qemu-assets/zImage
          OUT_BUILD="${PWD}/out/release-latest/linux" scripts/qemu_helper/make-qemu-dtb.sh --output=qemu-assets/imx6ull-aes.dtb
          ls -lh qemu-assets/

      - name: 上传 QEMU 内核产物
        uses: actions/upload-artifact@v4
        with:
          name: qemu-kernel
          path: |
            qemu-assets/zImage
            qemu-assets/imx6ull-aes.dtb
          retention-days: 7
          if-no-files-found: error

  # Stage 3+4: BusyBox + RootFS (合并)
  stage3-4:
    name: Stage 3+4 - BusyBox & RootFS
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_run == 'true'
    # 动态超时：有 compile-support-3rd-party 标签时 600 分钟，否则 30 分钟
    timeout-minutes: ${{ needs.check.outputs.compile_3rd_party == 'true' && 600 || 30 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 初始化 buildroot 子模块
        run: git submodule update --init --depth=1 third_party/buildroot

      - name: 构建 Docker 镜像
        run: cd docker && docker build -t ${{ env.DOCKER_IMAGE }} .

      - name: Cache ccache for BusyBox
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-full-busybox-${{ github.base_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-full-busybox-${{ github.base_ref || github.ref_name }}-
            ${{ runner.os }}-ccache-full-busybox-

      - name: Cache buildroot dl/
        uses: actions/cache@v4
        with:
          path: out/release-latest/buildroot/dl
          key: ${{ runner.os }}-buildroot-dl-2026.02-${{ github.base_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-buildroot-dl-2026.02-

      - name: 构建 rootfs via buildroot (Stage 3) + 校验 (Stage 4)
        run: |
          docker run --rm --user root \
            -v $PWD:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_BASEDIR=/workspace \
            -e CCACHE_NOHASHDIR=true \
            -e CCACHE_COMPILERCHECK=content \
            -e BUILDROOT_QT6=${{ needs.check.outputs.compile_3rd_party == 'true' && '1' || '0' }} \
            ${{ env.DOCKER_IMAGE }} \
            bash -c '
              set -e
              git config --global --add safe.directory "*"
              ccache -M 2G && ccache -z
              mkdir -p /workspace/ccache-bin
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-gcc
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-g++
              ln -sf /usr/bin/ccache /workspace/ccache-bin/arm-none-linux-gnueabihf-ar
              export PATH="/workspace/ccache-bin:${PATH}"
              ./scripts/release-all.sh --stage 3
              ./scripts/release-all.sh --stage 4
              ./scripts/varified_rootfs_ok.sh --rootfs-dir=out/release-latest/rootfs
              ccache -s
            '

      - name: 验证 rootfs 产物
        run: |
          if [ ! -x ${{ env.BUILD_OUTPUT }}/rootfs/bin/busybox ] || \
             [ ! -f ${{ env.BUILD_OUTPUT }}/rootfs/etc/inittab ]; then
            echo "::error::rootfs 产物缺失;上方 Stage 3/4 构建步骤可能已失败(回看其日志)"
            ls -lh ${{ env.BUILD_OUTPUT }}/rootfs/bin/busybox ${{ env.BUILD_OUTPUT }}/rootfs/etc/inittab 2>/dev/null || echo "(rootfs 不完整或不存在)"
            exit 1
          fi

      - name: 制作 QEMU rootfs 镜像（ext4 整卡，按树大小动态定容）
        run: |
          command -v mke2fs >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq e2fsprogs; }
          # out/ 由 docker 内 root 构建,runner 用户不可写;镜像产出到独立目录 qemu-assets/
          # QEMU SD 模型只认 2 的幂容量；按实际树大小 x2 向上取 2 的幂，最小 128MiB、封顶 4096
          TREE_MB=$(du -sm --apparent-size out/release-latest/rootfs | cut -f1)
          NEED=$(( TREE_MB * 2 )); [ "${NEED}" -lt 128 ] && NEED=128
          SIZE_MB=1
          while [ "${SIZE_MB}" -lt "${NEED}" ] && [ "${SIZE_MB}" -lt 4096 ]; do SIZE_MB=$(( SIZE_MB * 2 )); done
          echo "rootfs tree: ${TREE_MB}MiB -> image: ${SIZE_MB}MiB"
          mkdir -p qemu-assets
          scripts/qemu_helper/make-rootfs-img.sh --output=qemu-assets/rootfs.ext4 --size-mb="${SIZE_MB}"
          ls -lh qemu-assets/

      - name: 上传 QEMU rootfs 镜像
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rootfs
          path: qemu-assets/rootfs.ext4
          retention-days: 7
          if-no-files-found: error

  # QEMU 开机冒烟：编译产物必须真的开机（「能构建」→「能启动」）
  qemu-smoke:
    name: QEMU Boot Smoke
    runs-on: ubuntu-latest
    needs: [check, stage2-mainline, stage3-4]
    if: needs.check.outputs.should_run == 'true'
    # 首次构建自建 QEMU(arm-softmmu 单目标)约 10-20 分钟,缓存命中后只剩开机
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 安装依赖（自建 QEMU 的构建与运行库）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build flex bison libglib2.0-dev libpixman-1-dev \
            libfdt-dev zlib1g-dev python3-venv device-tree-compiler \
            libslirp0
          # libslirp0: 运行时库 — 自建 QEMU 动态链接 libslirp.so.0（slirp 以 wrap
          # subproject 编成共享库，构建时的 RPATH 只指向 build 目录；缓存只存裸二进制，
          # 恢复到新 runner 后 RPATH 失效，没有它 QEMU 起不来 rc=127，run 33701714661）

      - name: 恢复自建 QEMU 缓存（v11.1 + 板级补丁）
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: out/qemu/build/qemu-system-arm
          key: qemu-arm-v11.1.0-${{ hashFiles('patches/qemu/*.patch', '.gitmodules') }}

      - name: 构建自建 QEMU（仅缓存未命中时）
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth=1 third_party/qemu
          scripts/build_helper/build-qemu.sh

      - name: 校验自建 QEMU 可用
        run: |
          set -o pipefail
          test -x out/qemu/build/qemu-system-arm
          out/qemu/build/qemu-system-arm --version | head -1

      - name: 下载内核与 rootfs 产物
        uses: actions/download-artifact@v4
        with:
          pattern: qemu-*
          path: qemu-assets
          merge-multiple: true

      - name: 开机冒烟（启动到登录提示符才算过）
        run: |
          ls -lh qemu-assets/
          scripts/qemu_helper/run-qemu.sh --smoke --no-build \
            --kernel=qemu-assets/zImage \
            --dtb=qemu-assets/imx6ull-aes.dtb \
            --rootfs-img=qemu-assets/rootfs.ext4 \
            --timeout=300 \
            --append=earlycon \
            --log=qemu-assets/uart.log

      - name: 上传启动日志（开机证据）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-log
          path: qemu-assets/uart.log
          retention-days: 30
          if-no-files-found: warn

  # 最终验证和产物上传
  final:
    name: Final Validation
    runs-on: ubuntu-latest
    needs: [check, stage1, stage2-imx, stage2-mainline, stage3-4, qemu-smoke]
    if: needs.check.outputs.should_run == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 创建构建摘要
        run: |
          echo "## IMX-Forge 构建报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **U-Boot**: 构建成功" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux NXP BSP**: 构建成功" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux Mainline**: 构建成功" >> $GITHUB_STEP_SUMMARY
          echo "- **BusyBox**: 构建成功" >> $GITHUB_STEP_SUMMARY
          echo "- **RootFS**: 验证通过" >> $GITHUB_STEP_SUMMARY
          echo "- **QEMU 开机冒烟**: 通过（mainline 内核 + rootfs 在 QEMU 里真的启动到了登录提示符，见 qemu-boot-log artifact）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 第三方组件" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.check.outputs.compile_3rd_party }}" == "true" ]]; then
            echo "- **Qt6/字体**: 已编译(全模块 + CJK/Emoji 字体)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Qt6/字体**: 已跳过(最小 rootfs;添加 \`compile-support-3rd-party\` 标签启用)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 说明：CI 不产出烧录镜像（Stage 5 仅本地 \`release-all.sh\`）；运行时验证由 QEMU 开机冒烟承担。" >> $GITHUB_STEP_SUMMARY
